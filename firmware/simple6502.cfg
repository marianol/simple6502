# simple6502 ROM linker config (BIOS + WozMon + BASIC)
#
# ROM map (32K, $8000-$FFFF), one 32768 byte image:
#   $8000-$DBFF  ROM         BIOS jump table (HEADER) and BIOS code
#   $DC00-$FEFF  BASROM      MS BASIC, entry points at $DC00 (cold) and $DC03 (warm)
#   $FF00-$FFF9  MONITOR     WozMon
#   $FFFA-$FFFF  RSTVECTORS  NMI, RESET and IRQ vectors
#
# Every segment is optional on purpose, so the same config links the BIOS alone
# (make.sh), BASIC alone (basic/make_simple6502.sh) or both (make_rom.sh).
# The unused regions are filled with $00.

# Memory section
MEMORY {
    ZP:         start = $0000, size = $0100, type = rw;
    STACK:      start = $0100, size = $0100, type = rw;
    RAM:        start = $0200, size = $7D00, type = rw;
    IO:         start = $7F00, size = $0100, type = rw;
    ROM:        start = $8000, size = $5C00, type = ro, fill = yes, file = %O;
    BASROM:     start = $DC00, size = $2300, type = ro, fill = yes, file = %O;
    MONITOR:    start = $FF00, size = $FA,   type = ro, fill = yes, file = %O;
    RSTVECTORS: start = $FFFA, size = 6,     type = ro, fill = yes, file = %O;
    DUMMY:      start = $0000, size = $00FF, file = "";     # not written to the image
}

# Segments section
SEGMENTS {
    ZEROPAGE:       load = ZP,          type = zp;
    IO:             load = IO,          type = rw, optional = yes;
    # BIOS
    HEADER:         load = ROM,         type = ro, optional = yes;
    BIOS:           load = ROM,         type = ro, optional = yes;
    WOZMON:         load = MONITOR,     type = ro, optional = yes;
    RESETVECTORS:   load = RSTVECTORS,  type = ro, optional = yes;
    # BASIC. BASHEADER is not called HEADER to avoid a clash with the BIOS HEADER segment
    BASHEADER:      load = BASROM,      type = ro, optional = yes;
    VECTORS:        load = BASROM,      type = ro, optional = yes;
    KEYWORDS:       load = BASROM,      type = ro, optional = yes;
    ERROR:          load = BASROM,      type = ro, optional = yes;
    CODE:           load = BASROM,      type = ro, optional = yes;
    CHRGET:         load = BASROM,      type = ro, optional = yes;
    INIT:           load = BASROM,      type = ro, optional = yes;
    EXTRA:          load = BASROM,      type = ro, optional = yes;
    DUMMY:          load = DUMMY,       optional = yes;  # BASIC's token counting (macros.s), not linked into the binary
}
